[package]
name = "nba-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"
rayon = "1.8"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nba-sim"
path = "src/bin/nba-sim.rs"

[dev-dependencies]
proptest = "1.4"

# Aggressive optimizations for the simulation engine baseline
[profile.release]
lto = "fat"             # Enable Link-Time Optimization (cross-crate optimizations)
codegen-units = 1       # Maximize optimization at the cost of compile time
panic = "abort"         # Remove panic unwinding code
opt-level = 3           # Highest optimization level (default for release, but explicit)
strip = true            # Strip symbols to reduce binary size
